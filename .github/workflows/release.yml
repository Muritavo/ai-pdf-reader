# Builds the desktop packages of RELEASE/ and publishes them as a GitHub release whenever a pull request is merged
name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The version of RELEASE/package.json, told apart by the number of the run, as v0.0.0-build.12
      - id: version
        run: echo "version=$(node -p "require('./RELEASE/package.json').version")-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      # The packages are unsigned
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RELEASE/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: RELEASE
      - run: npm run dist:${{ matrix.target }} -- --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
        working-directory: RELEASE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            RELEASE/out/*.dmg
            RELEASE/out/*.exe
            RELEASE/out/*.AppImage
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Without these secrets the APK is signed with a throwaway debug key, so it doesn't install over the previous one
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RELEASE/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: RELEASE
      - run: npm run android
        working-directory: RELEASE
      - working-directory: RELEASE/android
        run: |
          VERSIONS="-PversionCode=${{ github.run_number }} -PversionName=$VERSION"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease $VERSIONS \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug $VERSIONS
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p ../out
          cp "$APK" "../out/Research Toolkit-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: RELEASE/out/*.apk
          if-no-files-found: error

  release:
    needs: [version, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh release create "$TAG" packages/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$TAG — $PR_TITLE" \
            --generate-notes
